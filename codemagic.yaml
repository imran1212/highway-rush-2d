workflows:
  highway-rush-android-test:
    name: Highway Rush 2D - Device Test APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    scripts:
      - name: Generate Android platform scaffold
        script: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name highway_rush_2d .
          fi
      - name: Get packages
        script: flutter pub get
      - name: Analyze Dart code
        script: flutter analyze
      - name: Run tests
        script: flutter test
      - name: Build debug APK
        script: flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk
      - flutter analyze
      - flutter test

  highway-rush-playstore-release:
    name: Highway Rush 2D - Play Store Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      android_signing:
        - highway_rush_upload
    scripts:
      - name: Generate Android platform scaffold
        script: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name highway_rush_2d .
          fi
      - name: Get packages
        script: flutter pub get
      - name: Analyze Dart code
        script: flutter analyze
      - name: Run tests
        script: flutter test
      - name: Build signed release APK
        script: flutter build apk --release
      - name: Build signed Play Store App Bundle
        script: flutter build appbundle --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      - build/app/outputs/bundle/release/app-release.aab
      - flutter analyze
      - flutter test
